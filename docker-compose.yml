version: '3.8'

services:
  api:
    build:
      context: .
      target: api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      # - DATABASE_URL=your_postgres_database_url
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - api
    restart: unless-stopped
